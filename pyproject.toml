[project]
name = "retail-agent"
version = "0.1.0"
description = "Live retail address-update agent demo with Hermes, NVIDIA NIM, Streamlit, and evals."
requires-python = ">=3.11"
dependencies = [
    "langchain-core>=0.3.0",
    "langchain-nvidia-ai-endpoints>=0.3.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.0",
    "streamlit>=1.40.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
